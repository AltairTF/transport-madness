name: sim tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned, not ubuntu-latest: the golden hash in DeterminismTests depends on the platform's maths library (glibc here).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test the simulation
        working-directory: sim
        run: dotnet test --configuration Release
